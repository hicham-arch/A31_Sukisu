name: Build KernelSU Kernel
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: "2G"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Load config.env
      run: |
        if [ -f config.env ]; then
          grep -v -E "^#|^\n" config.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV
        else
          echo "config.env not found, using defaults"
        fi

    - name: Free Disk Space (Optional)
      if: env.REMOVE_UNUSED_PACKAGES == 'true' || env.REMOVE_UNUSED_PACKAGES == ''
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set Swap Space (6GB)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 6

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex git libelf-dev \
          libssl-dev lz4 ncurses-dev python3 unzip wget xz-utils zstd \
          clang lld libstdc++-12-dev lib32z1-dev gcc-multilib g++-multilib zip
        sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ hashFiles('**/buildKernel.sh') }}
        max-size: 2G

    - name: Download Proton Clang
      run: |
        mkdir -p toolchains
        cd toolchains
        git clone https://github.com/kdrag0n/proton-clang --depth=1 .
        echo "PATH=$GITHUB_WORKSPACE/toolchains/bin:$PATH" >> $GITHUB_ENV
        git clone https://github.com/physwizz/toolchain_cross-compile
        mv toolchain_cross-compile/ gcc/

    - name: Build Kernel with buildKernel.sh
      run: |
        chmod +x buildKernel.sh
        ./buildKernel.sh

    - name: Patch KPM
      run: |
        mkdir patchKPM
        cd patchKPM
        wget https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.12.2/patch_linux
        chmod +x patch_linux
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/mediatek/mt6768.dtb $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
        ./patch_linux
        mv -f oImage Image
        gzip -9 -k Image
        mv -f Image.gz Image $GITHUB_WORKSPACE/out/arch/arm64/boot/

    - name: Create Image.gz-dtb
      run: |
        cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/mediatek/mt6768.dtb > out/arch/arm64/boot/Image.gz-dtb || echo "DTB append failed or files missing"
        
    - name: Create boot.img
      run: |
        git clone https://github.com/cfig/Android_boot_image_editor/releases/download/v15_r1/boot_editor_v15_r1.zip
        unzip boot_editor_v15_r1.zip
        cd boot_editor_v15_r1/
        wget https://archive.org/download/boot_20251126/boot.img
        ./gradlew unpack
        rm build/unzip_boot/kernel
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz build/unzip_boot/kernel
        ./gradlew pack
        mv boot.img.signed $GITHUB_WORKSPACE/out/arch/arm64/boot/boot.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/Edhic1/AnyKernel3 -b Samsung_A31 anykernel
        cd anykernel
        cp ../out/arch/arm64/boot/Image.gz-dtb .
        zip -r9 ../KernelSU-A31-Flashable.zip * -x .git README.md *placeholder

    - name: Prepare Artifact
      run: |
        mkdir -p artifact
        cp KernelSU-A31-Flashable.zip artifact/ || echo "Flashable ZIP not found"
        find out/arch/arm64/boot -name "Image*" -o -name "*.gz" -o -name "*.dtb" -name "boot.img" | xargs -I {} cp {} artifact/ || true
        cd artifact
        sha256sum * > checksum.txt || echo "No files to checksum"

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSukiSU-A31-${{ github.run_number }}
        path: artifact/*

    - name: Create GitHub Release (if tag provided)
      if: github.event.inputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: Kernel SukiSU Build - ${{ github.event.inputs.release_tag }}
        files: |
          artifact/*
        draft: false
        prerelease: false
